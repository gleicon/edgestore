[package]
name = "edgestore-tokio"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Async Tokio integration for EdgeStore"
keywords = ["edgestore", "tokio", "async", "database"]
categories = ["database-implementations", "asynchronous"]

[dependencies]
edgestore = { path = "../edgestore", version = "2.0.2" }
edgestore-tier = { path = "../edgestore-tier", version = "2.0.0", optional = true }
tokio = { version = "1.44", features = ["sync", "rt"] }

[features]
tier = ["dep:edgestore-tier"]

[dev-dependencies]
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
edgestore-repl = { path = "../edgestore-repl" }
tempfile = "3"
