[graph]
targets = []

[advisories]
version = 2
# Deny all advisories unless explicitly ignored below.
# New vulnerabilities in any dependency will fail CI.
yanked = "deny"

ignore = [
    # h2 0.3.x: unbounded empty DATA frames (low severity).
    # Pulled transitively by AWS SDK's legacy hyper-0.14 compatibility layer.
    # The modern hyper-1.x / h2-0.4 path is used at runtime; the legacy path
    # is compiled in but unreachable from edgestore code. Blocked on AWS SDK
    # dropping hyper-0.14. Track: https://github.com/smithy-lang/smithy-rs
    "RUSTSEC-2026-0258",
    # rustls 0.21.x: name-constraint and CRL parsing advisories (0098/0099/0104).
    # Same root cause as above — AWS SDK legacy rustls-0.21 layer.
    # The modern rustls-0.23 / aws-lc-rs path is the runtime path.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # paste: unmaintained notice (not a vulnerability).
    # Pulled by parquet v53.x (dev dependency of edgestore for benchmarks only).
    # Not present in any published binary.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"   # AWS SDK ships dual hyper/rustls stacks; warn, don't block
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
