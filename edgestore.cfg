\* TLC model-checking configuration for edgestore.tla
\* Run with: java -jar tla2tools.jar -config edgestore.cfg edgestore.tla
\* Or via the TLA+ Toolbox IDE (add this as a model run configuration).

CONSTANTS
    Keys    = {"k1", "k2", "k3"}
    Values  = {"v1", "v2"}
    MaxLsn  = 8
    ABSENT  = ABSENT

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoDataLoss
    FlushSafety
    LsnMonotonic
    SegmentLsnOrder

\* AllInvariants is the conjunction of the above four — use it as an alternative
\* single check. Either form works; listing them separately gives better error
\* messages from TLC when a violation is found.
\* INVARIANTS AllInvariants
