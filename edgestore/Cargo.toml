[package]
name = "edgestore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-first embedded KV + vector database in Rust"
repository = "https://github.com/gleicon/edgestore"
homepage = "https://github.com/gleicon/edgestore"
readme = "../README.md"
keywords = ["kv", "vector", "database", "embedded", "local-first"]
categories = ["database", "data-structures"]

[lib]
name = "edgestore"
path = "src/lib.rs"

[dependencies]
lz4_flex = "*"
zstd = "*"
crc32c = "*"
byteorder = "*"
blake3 = "*"
fs2 = "*"
xorf = { version = "*", features = ["serde"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
wide = "0.7"
lazy_static = "1"

[dev-dependencies]
tempfile = "*"
rmp-serde = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "hnsw_recall"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "text_search"
harness = false
