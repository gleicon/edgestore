[package]
name = "edgestore"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Local-first embedded KV + vector database in Rust"
keywords = ["database", "kv-store", "embedded", "vector", "ssd"]
categories = ["database-implementations", "data-structures", "caching"]

[lib]
name = "edgestore"
path = "src/lib.rs"

[dependencies]
log = "0.4"
lz4_flex = "0.13"
zstd = "0.13"
crc32c = "0.6"
byteorder = "1.5"
blake3 = "1.8"
fs2 = "0.4"
xorf = { version = "0.12", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wide = "0.7"
lazy_static = "1"

[dev-dependencies]
tempfile = "3"
rmp-serde = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "hnsw_recall"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "text_search"
harness = false
