[package]
name = "edgestore-repl"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "REPL and HTTP server for EdgeStore"
keywords = ["edgestore", "repl", "database", "http", "server"]
categories = ["database-implementations"]

[dependencies]
edgestore = { path = "../edgestore", version = "1.0.11" }
ureq = { version = "2", features = [] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
blake3 = "1"

# S3 support — optional, enabled by `s3` feature
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]
