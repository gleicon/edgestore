[package]
name = "edgestore-tokio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Async Tokio integration for EdgeStore"
keywords = ["edgestore", "tokio", "async", "database"]
categories = ["database-implementations", "asynchronous"]

[dependencies]
edgestore = { path = "../edgestore" }
tokio = { version = "1.44", features = ["sync", "rt"] }

[dev-dependencies]
tokio = { version = "1.44", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
