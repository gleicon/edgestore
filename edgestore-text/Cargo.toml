[package]
name = "edgestore-text"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Full-text search extension for edgestore"
keywords = ["database", "search", "bm25", "nlp", "edgestore"]
categories = ["database-implementations", "text-processing"]

[dependencies]
edgestore = { path = "../edgestore" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rust-stemmers = "1.0"
stop-words = "0.8"

[dev-dependencies]
tempfile = "3"
